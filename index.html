<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanuka QR - Pro Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Outfit',system-ui}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:#000 url('bg.jpg') center/cover no-repeat fixed}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:-1}
.card{width:100%;max-width:420px;background:rgba(18,18,18,0.65);border:1px solid rgba(255,255,255,0.15);border-radius:28px;padding:28px;backdrop-filter:blur(20px);box-shadow:0 0 80px rgba(255,0,60,0.25), inset 0 0 0 1px rgba(255,255,255,0.05)}
h1{margin:0;text-align:center;font-size:26px;letter-spacing:0.5px}
.sub{text-align:center;color:#aaa;font-size:13px;margin:8px 0 22px}
input{width:100%;padding:15px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:14px;color:#fff;outline:none}
input:focus{border-color:#ff2345}
button.main{width:100%;padding:15px;background:linear-gradient(90deg,#ff1a4d,#cc001f);color:#fff;border:none;border-radius:14px;font-weight:800;font-size:16px;margin-top:18px;cursor:pointer;box-shadow:0 8px 25px rgba(255,0,60,0.4)}
#qr{background:#fff;border-radius:18px;padding:18px;display:flex;justify-content:center;margin-top:20px;min-height:180px;align-items:center}
.footer{margin-top:28px;color:rgba(255,255,255,0.7);font-size:14px;letter-spacing:0.5px}
.footer b{color:#fff}
.footer span{color:#ff2345}
</style>
</head>
<body>
<div class="card">
<h1>⚡ SANUKA QR</h1>
<div class="sub">Create secure QR codes instantly — dark, fast, stylish</div>
<input id="text" placeholder="https://your-link.com" value="https://github.com/sanuwa-ofc">
<button class="main" onclick="gen()">Generate QR</button>
<div id="qr"><span style="color:#999">Your QR will appear here</span></div>
<button class="main" id="dl" style="display:none;background:#fff;color:#000" onclick="download()">Download PNG</button>
</div>
<div class="footer">Made by <b>Sanuka</b> with <span>❤️</span></div>

<script>
function gen(){
 const v=document.getElementById('text').value;
 if(!v) return alert('Please enter text');
 const box=document.getElementById('qr'); box.innerHTML='';
 new QRCode(box,{text:v,width:220,height:220,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H});
 document.getElementById('dl').style.display='block';
}
function download(){
 const img=document.querySelector('#qr img'); if(!img) return;
 const a=document.createElement('a'); a.href=img.src; a.download='Sanuka-QR.png'; a.click();
}
gen();
</script>
</body>
  </html>
