<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANUKA QR - Pro Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;min-height:100vh;background:#000 url('bg.jpg') center/cover fixed;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);z-index:-1}
.phone{width:100%;max-width:380px;background:rgba(255,255,255,0.06);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.15);border-radius:32px;padding:22px;box-shadow:0 0 80px rgba(255,20,60,0.2), inset 0 1px 0 rgba(255,255,255,0.1)}
.top{font-size:13px;color:#fff;display:flex;justify-content:space-between;opacity:0.8}
.title{margin:18px 0 6px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:21px}
.title i{color:#ff1a4d;text-shadow:0 0 12px #ff1a4d}
.sub{color:rgba(255,255,255,0.7);font-size:13px;margin-bottom:22px;line-height:1.4}
.label{color:#fff;font-weight:600;font-size:14px;margin:18px 0 10px}
.inputBox{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px}
.inputBox input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:14px}
.styles{display:flex;gap:8px}
.styles button{flex:1;padding:10px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:13px;cursor:pointer}
.styles button.active{background:#ff1a4d;border-color:#ff1a4d;box-shadow:0 0 15px rgba(255,26,77,0.5)}
.sizeRow{display:flex;align-items:center;gap:12px;color:#fff;font-size:14px}
.sizeRow input{flex:1;accent-color:#ff1a4d}
.qrWrap{background:rgba(255,255,255,0.08);border-radius:20px;padding:16px;display:flex;justify-content:center;margin:18px 0;min-height:200px;align-items:center}
#qr{background:#fff;padding:12px;border-radius:14px}
.btn{width:100%;padding:15px;border:none;border-radius:16px;background:linear-gradient(90deg,#e6002d,#b00022);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 25px rgba(230,0,45,0.4);display:flex;justify-content:center;gap:8px}
.links{text-align:center;margin-top:14px;color:#ff8a9d;font-size:13px;cursor:pointer;text-decoration:underline}
.footer{margin-top:30px;color:rgba(255,255,255,0.6);font-size:14px;letter-spacing:0.5px}
.footer b{color:#fff} .footer span{color:#ff4d6d}
</style>
</head>
<body>
<div class="phone">
<div class="top"><span>9:41</span><span>●●● 📶 🔋</span></div>
<div class="title"><i>✦</i> SANUKA QR - Pro Generator</div>
<div class="sub">Create secure QR codes instantly — dark, fast, stylish</div>

<div class="label">Content / URL</div>
<div class="inputBox">🔗<input id="text" value="https://your-link.com" placeholder="https://your-link.com"></div>

<div class="label">Style:</div>
<div class="styles">
<button class="active" onclick="setStyle(this,'normal')">Normal</button>
<button onclick="setStyle(this,'rounded')">Rounded</button>
<button onclick="setStyle(this,'dot')">Dot</button>
</div>

<div class="label">Size:</div>
<div class="sizeRow">Size: <input type="range" id="size" min="200" max="800" value="512" oninput="document.getElementById('sizeTxt').innerText=this.value+' x '+this.value+'px'"><span id="sizeTxt" style="color:#ff8a9d">512 x 512px</span></div>

<div class="qrWrap"><div id="qr"></div></div>
<button class="btn" onclick="gen()">⬇ Generate QR</button>
<div class="links" onclick="download()">Download PNG • SVG</div>
</div>

<div class="footer">Made by <b>Sanuka</b> with <span>❤️</span></div>

<script>
let curStyle='normal';
function setStyle(el,s){document.querySelectorAll('.styles button').forEach(b=>b.classList.remove('active'));el.classList.add('active');curStyle=s; gen();}
function gen(){
 let t=document.getElementById('text').value; if(!t) return;
 let box=document.getElementById('qr'); box.innerHTML='';
 new QRCode(box,{text:t,width:160,height:160,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});
}
function download(){
 let img=document.querySelector('#qr img'); if(!img) return;
 let a=document.createElement('a'); a.href=img.src; a.download='Sanuka-QR.png'; a.click();
}
gen();
</script>
</body>
 </html>
